interface:
  display_name: "Toon Character Shading"
  short_description: "Unity URP 캐릭터와 배경을 평평한 애니(툰) 그림체로 맞춥니다: 재질 값, 텍스처에 그려진 빛 평탄화, 식생 툰 셰이더, 수치 검증"
  default_prompt: "$toon-character-shading으로 캐릭터가 왜 반짝이는지 재질 값부터 확인하고, 툰 셰이더를 적용한 뒤 얼굴·몸 피부 색을 같은 시점에서 수치로 비교해줘."
policy:
  allow_implicit_invocation: true
